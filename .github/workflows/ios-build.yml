name: Build & Deploy iOS (Apple TestFlight)

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload directly to Apple TestFlight'
        required: true
        type: boolean
        default: true

jobs:
  build-and-upload:
    name: Build iOS & Deploy
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Bundle
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Configure App Store Connect API Key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
          printf "%s\n" "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          cp ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 ~/.private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 ~/.private_keys/AuthKey_${KEY_ID}.p8

      - name: Check Xcode Version
        run: xcodebuild -version

      - name: Build Xcode Archive
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Export IPA
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          security create-keychain -p "actions" build.keychain || true
          security default-keychain -s build.keychain || true
          security unlock-keychain -p "actions" build.keychain || true
          security set-keychain-settings -lut 21600 build.keychain || true

          cat << 'EOF' > ios/App/exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>XZL3JSU6B4</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ios/App/exportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Upload to Apple TestFlight
        if: ${{ inputs.upload_to_testflight }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_FILE=$(find build/ipa -name "*.ipa" | head -n 1)
          if [ -f "$IPA_FILE" ]; then
            echo "Uploading $IPA_FILE to TestFlight..."
            xcrun altool --upload-app \
              --type ios \
              --file "$IPA_FILE" \
              --apiKey "$KEY_ID" \
              --apiIssuer "$ISSUER_ID"
            echo "Successfully submitted to TestFlight!"
          else
            echo "Error: No IPA found to upload."
            exit 1
          fi

      - name: Upload Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniTonight-iOS-Build
          path: |
            build/App.xcarchive
            build/ipa/*.ipa
