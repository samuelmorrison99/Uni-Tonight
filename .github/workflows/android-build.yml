name: Build Android APK & App Bundle

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK and Bundle
        run: |
          rm -f android/local.properties
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug bundleRelease --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../UniTonight-v1.0.4.apk

      - name: Upload Android Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UniTonight-Android-Build
          path: |
            UniTonight-v1.0.4.apk
            android/app/build/outputs/bundle/release/*.aab

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: "UniTonight v1.0.4 (Android Profile Save Fix)"
          body: "Updated Android build with fixed Firestore profile saving (`uni-tonight-c8c75`). Download `UniTonight-v1.0.4.apk` on your Google Pixel to install."
          files: |
            UniTonight-v1.0.4.apk
          prerelease: false
